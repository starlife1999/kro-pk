<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coming Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0f172a;
      --ink: #111827;
      --white: #f8fafc;
      --red: #ef4444;
      --yellow: #fbbf24;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Permanent Marker', cursive;
    }

    .slideshow,
    .slide,
    .overlay {
      position: fixed;
      inset: 0;
    }

    .slideshow {
      z-index: 1;
    }

    .slide {
      opacity: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.68), rgba(15, 23, 42, 0.82)),
        rgba(15, 23, 42, 0.34);
    }

    .login-link {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 10;
      color: var(--white);
      font-family: 'Bangers', cursive;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      opacity: 0.82;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .login-link:hover {
      color: var(--yellow);
      opacity: 1;
    }

    .main-stage {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: max(3.75rem, env(safe-area-inset-top)) 1.25rem max(4.75rem, env(safe-area-inset-bottom));
    }

    .signup-panel {
      width: min(520px, 100%);
    }

    .signup-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      width: 100%;
    }

    .signup-form input {
      min-height: 56px;
      border: 3px solid var(--white);
      background: rgba(15, 23, 42, 0.84);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      padding: 0.95rem 1rem;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.45);
    }

    .signup-form input::placeholder {
      color: #94a3b8;
    }

    .signup-form input:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .signup-submit {
      min-height: 56px;
      border: 3px solid var(--white);
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      font-family: 'Bangers', cursive;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      letter-spacing: 0.06em;
      padding: 0.8rem 1rem;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.45);
      transition: all 0.2s ease;
    }

    .signup-submit:hover,
    .signup-submit:focus-visible {
      transform: translateY(-2px);
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 7px 7px 0 var(--red);
      outline: none;
    }

    .signup-submit:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .signup-status {
      min-height: 1.25rem;
      margin-top: 1rem;
      color: var(--yellow);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      text-align: center;
    }

    .signup-status.error {
      color: #fecaca;
    }

    .social {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      z-index: 10;
      display: flex;
      gap: 1rem;
      transform: translateX(-50%);
    }

    .social a {
      color: var(--white);
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .social a:hover {
      color: var(--yellow);
    }

    @media (max-width: 640px) {
      body {
        overflow-y: auto;
      }

      .signup-panel {
        width: min(360px, 100%);
      }

      .signup-form {
        grid-template-columns: 1fr;
      }

      .signup-submit {
        width: 100%;
      }

      .social {
        bottom: max(1rem, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="slideshow" aria-hidden="true">
    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <div class="overlay" aria-hidden="true"></div>

  <a class="login-link" href="/admin">LOG IN</a>

  <main class="main-stage">
    <section class="signup-panel" aria-label="Email signup">
      <form class="signup-form" id="signupForm">
        <input type="email" id="signupEmail" placeholder="your@email.com" autocomplete="email" required>
        <button class="signup-submit" type="submit">GET EARLY ACCESS</button>
      </form>
      <p class="signup-status" id="signupStatus" aria-live="polite"></p>
    </section>
  </main>

  <nav class="social" aria-label="Social links">
    <a href="https://www.instagram.com/kro_pk1" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="https://www.tiktok.com/@kro_pk" target="_blank" rel="noopener noreferrer">TikTok</a>
  </nav>

  <script>
    const images = ['campaign-3.jpg', 'slideshow-1.jpg', 'slideshow-2.jpg'];

    const slides = document.querySelectorAll('.slide');
    let current = 0;

    slides.forEach((slide, i) => {
      slide.style.backgroundImage = `url('${images[i]}')`;
    });

    function goToSlide(index) {
      slides[current].classList.remove('active');
      current = index;
      slides[current].classList.add('active');
    }

    setInterval(() => {
      goToSlide((current + 1) % images.length);
    }, 1800);

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('signupEmail');
      const status = document.getElementById('signupStatus');
      const submit = e.currentTarget.querySelector('button');
      const email = emailInput.value.trim();
      if (!email) return;

      status.classList.remove('error');
      status.textContent = 'Joining...';
      submit.disabled = true;

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name: '' })
        });
        if (!res.ok) throw new Error('Subscribe failed');
        emailInput.value = '';
        status.textContent = "You're on the early access list.";
      } catch {
        status.classList.add('error');
        status.textContent = 'Could not join right now. Try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
