<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — KRO PK</title>
  <style>
    body { margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif; }
    .panel { width:min(420px,calc(100vw-2rem));background:#111827;border:2px solid #f8fafc;padding:2rem;border-radius:18px; }
    h1 { margin:0 0 1rem;font-size:2rem;text-align:center;color:#fbbf24; }
    label { display:block;margin:.75rem 0 .25rem;font-size:.9rem;color:#94a3b8; }
    input { width:100%;padding:.9rem 1rem;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#f8fafc;font-size:1rem; }
    button { width:100%;margin-top:1.5rem;padding:1rem;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:1rem;cursor:pointer; }
    .hint { margin-top:1rem;font-size:.9rem;color:#94a3b8;text-align:center; }
    .toast { position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#111827;color:#f8fafc;padding:1rem 1.5rem;border:1px solid #334155;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s ease; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Admin login</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="hint">Use your admin email and password from the .env file.</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const toast = document.getElementById('toast');
    const showToast = msg => {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    };

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return showToast('Fill both fields');

      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (res.ok) {
        window.location.href = '/admin';
      } else {
        const body = await res.json().catch(() => ({}));
        showToast(body.message || 'Login failed');
      }
    });
  </script>
</body>
</html>
