    </div>

    <!-- Enter button -->
    <a href="shop1.html" class="enter-btn" id="enterSiteBtn">
        <div class="enter-text">SHOP KRO!</div>
    </a>

    <nav class="home-links" aria-label="Homepage links">
        <a href="/about.html">About</a>
        <a href="/shop">Shop</a>
    </nav>

    <!-- Slide indicators -->
    <div class="indicators">
        <div class="dot active" onclick="goToSlide(0)"></div>
        <div class="dot" onclick="goToSlide(1)"></div>
        <div class="dot" onclick="goToSlide(2)"></div>
        <div class="dot" onclick="goToSlide(3)"></div>
        <div class="dot" onclick="goToSlide(4)"></div>
    </div>

   <script>
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    const images = ['campaign-3.jpg', 'slideshow-1.jpg', 'slideshow-2.jpg'];
    let current = 0;

    // Set images on the first three slides, hide the rest
    slides.forEach((slide, i) => {
        if (i < images.length) {
            slide.style.backgroundImage = `url('${images[i]}')`;
            slide.style.backgroundSize = 'cover';
            slide.style.backgroundPosition = 'center';
        } else {
            slide.style.display = 'none';
        }
    });

    // Hide unused dots
    dots.forEach((dot, i) => {
        if (i >= images.length) dot.style.display = 'none';
    });

    function goToSlide(index) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = index;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
    }

    const enterSiteBtn = document.getElementById('enterSiteBtn');
    enterSiteBtn.addEventListener('click', (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
        event.preventDefault();
        enterSiteBtn.classList.remove('tap-vroom');
        void enterSiteBtn.offsetWidth;
        enterSiteBtn.classList.add('tap-vroom');
        setTimeout(() => {
            window.location.href = enterSiteBtn.getAttribute('href');
        }, 320);
    });

    // Auto-advance every 1.5 seconds
    setInterval(() => {
        goToSlide((current + 1) % images.length);
    }, 1500);
</script>
