<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KRO PK — Coming Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #0f172a;
      --white: #f8fafc;
      --red: #ef4444;
      --yellow: #fbbf24;
    }
    html, body {
      min-height: 100vh;
      font-family: 'Permanent Marker', cursive;
      background: var(--navy);
      color: var(--white);
      overflow-x: hidden;
    }
    .mosaic-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .mosaic {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 140%;
      height: 140%;
      left: -20%;
      top: -20%;
      position: absolute;
      animation: mosaic-drift 40s linear infinite;
    }
    @keyframes mosaic-drift {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-3%, -2%); }
      100% { transform: translate(0, 0); }
    }
    .mosaic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.85);
    }
    .mosaic-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      z-index: 1;
    }
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(15, 23, 42, 0.95);
      border: 4px solid var(--white);
      box-shadow: 8px 8px 0 var(--red);
      padding: 2rem 1.75rem;
      text-align: center;
    }
    .logo {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      letter-spacing: 0.08em;
      text-shadow: 4px 4px 0 var(--red);
      margin-bottom: 0.35rem;
    }
    .tagline {
      color: var(--yellow);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 3px solid #334155;
      background: var(--navy);
      color: var(--white);
      font-family: 'Comic Neue', Arial, sans-serif;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--yellow);
    }
    .enter-btn {
      width: 100%;
      padding: 1rem;
      border: 3px solid var(--white);
      background: var(--red);
      color: var(--white);
      font-family: 'Bangers', cursive;
      font-size: 1.25rem;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.2s, transform 0.2s;
    }
    .enter-btn:hover {
      background: var(--yellow);
      color: var(--navy);
      transform: translateY(-2px);
    }
    .error {
      display: none;
      margin-top: 1rem;
      color: #f87171;
      font-size: 0.95rem;
    }
    .error.show { display: block; }
    .social {
      margin-top: 2.5rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .social a {
      color: var(--yellow);
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 2px solid transparent;
    }
    .social a:hover { border-bottom-color: var(--yellow); }
  </style>
</head>
<body>
  <div class="mosaic-wrap" aria-hidden="true">
    <div class="mosaic" id="mosaicGrid"></div>
  </div>
  <div class="mosaic-overlay" aria-hidden="true"></div>

  <div class="page">
    <div class="card">
      <div class="logo">KRO PK</div>
      <div class="tagline">Drop 2026 — Motorsport</div>
      <form id="gateForm">
        <label for="gatePassword">Enter access password</label>
        <input type="password" id="gatePassword" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="enter-btn">ENTER</button>
      </form>
      <p class="error" id="gateError">Wrong password. Try again.</p>
    </div>
    <nav class="social" aria-label="Social links">
      <a href="https://www.instagram.com/kro_pk1" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.tiktok.com/@kro_pk" target="_blank" rel="noopener noreferrer">TikTok</a>
    </nav>
  </div>

  <script>
    const IMAGES = ['campaign-3.jpg', 'slideshow-1.jpg', 'slideshow-2.jpg'];
    const PASS = 'KROPK2026';
    const STORAGE_KEY = 'kro_pk_site_unlocked';

    if (localStorage.getItem(STORAGE_KEY) === '1') {
      window.location.replace('/shop1.html');
    }

    const grid = document.getElementById('mosaicGrid');
    const cells = 12;
    for (let i = 0; i < cells; i++) {
      const img = document.createElement('img');
      img.src = IMAGES[i % IMAGES.length];
      img.alt = '';
      grid.appendChild(img);
    }

    document.getElementById('gateForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const err = document.getElementById('gateError');
      const value = document.getElementById('gatePassword').value.trim();
      if (value === PASS) {
        localStorage.setItem(STORAGE_KEY, '1');
        window.location.href = '/shop1.html';
        return;
      }
      err.classList.add('show');
    });
    document.getElementById('gatePassword').addEventListener('input', () => {
      document.getElementById('gateError').classList.remove('show');
    });
  </script>
</body>
</html>
