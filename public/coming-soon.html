<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KRO PK - Coming Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0f172a;
      --ink: #111827;
      --white: #f8fafc;
      --muted: #cbd5e1;
      --red: #ef4444;
      --yellow: #fbbf24;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Permanent Marker', cursive;
    }

    .slideshow,
    .slide,
    .overlay {
      position: fixed;
      inset: 0;
    }

    .slideshow {
      z-index: 1;
    }

    .slide {
      opacity: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.34)),
        linear-gradient(180deg, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.86));
    }

    .password-access {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      max-width: calc(100vw - 2rem);
      flex-wrap: wrap;
    }

    .password-toggle,
    .password-submit {
      border: 2px solid rgba(248, 250, 252, 0.72);
      background: rgba(15, 23, 42, 0.58);
      color: var(--white);
      cursor: pointer;
      font-family: 'Bangers', cursive;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .password-toggle {
      padding: 0.48rem 0.72rem;
      font-size: 0.78rem;
    }

    .password-submit {
      min-height: 36px;
      padding: 0.42rem 0.58rem;
      font-size: 0.82rem;
      background: rgba(239, 68, 68, 0.84);
    }

    .password-toggle:hover,
    .password-submit:hover {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--ink);
    }

    .password-form {
      display: none;
      align-items: center;
      gap: 0.45rem;
    }

    .password-form.open {
      display: flex;
    }

    .password-form input {
      width: min(185px, calc(100vw - 8rem));
      min-height: 36px;
      border: 2px solid rgba(248, 250, 252, 0.72);
      background: rgba(15, 23, 42, 0.72);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      padding: 0.42rem 0.58rem;
    }

    .password-form input:focus,
    .signup-form input:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .password-error {
      display: none;
      width: 100%;
      text-align: right;
      color: #fecaca;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .password-error.show {
      display: block;
    }

    .main-stage {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: max(4.5rem, env(safe-area-inset-top)) 1.25rem max(5rem, env(safe-area-inset-bottom));
    }

    .signup-panel {
      width: min(560px, 100%);
      text-align: center;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);
    }

    .brand-logo {
      display: inline-block;
      font-family: 'Bangers', cursive;
      font-size: clamp(3rem, 11vw, 6.5rem);
      letter-spacing: 0.08em;
      text-shadow: 5px 5px 0 var(--red);
      line-height: 0.9;
    }

    .drop-label {
      margin-top: 0.75rem;
      color: var(--yellow);
      font-size: clamp(0.95rem, 2.6vw, 1.25rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 1.35rem;
      font-family: 'Bangers', cursive;
      font-size: clamp(3.1rem, 13vw, 7rem);
      line-height: 0.82;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hype {
      width: min(440px, 100%);
      margin: 1rem auto 1.5rem;
      color: var(--white);
      font-size: clamp(1rem, 3vw, 1.28rem);
      line-height: 1.45;
    }

    .signup-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      width: min(520px, 100%);
      margin: 0 auto;
    }

    .signup-form input {
      min-height: 56px;
      border: 3px solid var(--white);
      background: rgba(15, 23, 42, 0.82);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      padding: 0.95rem 1rem;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.45);
    }

    .signup-form input::placeholder,
    .password-form input::placeholder {
      color: #94a3b8;
    }

    .signup-submit {
      min-height: 56px;
      border: 3px solid var(--white);
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      font-family: 'Bangers', cursive;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      letter-spacing: 0.06em;
      padding: 0.8rem 1rem;
      text-transform: uppercase;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.45);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .signup-submit:hover {
      transform: translateY(-2px);
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 7px 7px 0 var(--red);
    }

    .signup-status {
      min-height: 1.35rem;
      margin-top: 1rem;
      color: var(--yellow);
      font-size: 1rem;
    }

    .signup-status.error {
      color: #fecaca;
    }

    .social {
      position: fixed;
      bottom: max(2rem, env(safe-area-inset-bottom));
      left: 50%;
      z-index: 10;
      display: flex;
      gap: 1rem;
      transform: translateX(-50%);
    }

    .social a {
      border: 2px solid rgba(248, 250, 252, 0.82);
      background: rgba(15, 23, 42, 0.52);
      color: var(--white);
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      letter-spacing: 0.05em;
      padding: 0.5rem 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social a:hover {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--ink);
    }

    .indicators {
      position: fixed;
      bottom: max(5rem, calc(4.5rem + env(safe-area-inset-bottom)));
      left: 50%;
      z-index: 10;
      display: flex;
      gap: 0.85rem;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .dot {
      width: 11px;
      height: 11px;
      border: 2px solid var(--white);
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: var(--yellow);
      border-color: var(--yellow);
    }

    @media (max-width: 640px) {
      body {
        overflow-y: auto;
      }

      .password-access {
        align-items: flex-end;
        flex-direction: column;
        gap: 0.4rem;
      }

      .password-form {
        justify-content: flex-end;
        width: 100%;
      }

      .signup-form {
        grid-template-columns: 1fr;
      }

      .signup-submit {
        width: 100%;
      }

      .social {
        bottom: max(1rem, env(safe-area-inset-bottom));
      }

      .indicators {
        bottom: max(4.25rem, calc(3.75rem + env(safe-area-inset-bottom)));
      }
    }
  </style>
</head>
<body>
  <div class="slideshow" aria-hidden="true">
    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <div class="overlay" aria-hidden="true"></div>

  <div class="password-access">
    <button class="password-toggle" id="passwordToggle" type="button">I have a password</button>
    <form class="password-form" id="gateForm">
      <input type="password" id="gatePassword" placeholder="Password" autocomplete="current-password" required>
      <button class="password-submit" type="submit">Enter</button>
    </form>
    <div class="password-error" id="gateError">Wrong password</div>
  </div>

  <main class="main-stage">
    <section class="signup-panel" aria-labelledby="comingSoonTitle">
      <div class="brand-logo">KRO PK</div>
      <div class="drop-label">DROP 2026 - MOTORSPORT</div>
      <h1 id="comingSoonTitle">DROP INCOMING</h1>
      <p class="hype">The next KRO PK release is warming up. Join the list for first access, private codes, and behind-the-scenes updates.</p>
      <form class="signup-form" id="signupForm">
        <input type="email" id="signupEmail" placeholder="your@email.com" autocomplete="email" required>
        <button class="signup-submit" type="submit">GET EARLY ACCESS</button>
      </form>
      <p class="signup-status" id="signupStatus" aria-live="polite"></p>
    </section>
  </main>

  <div class="indicators" aria-hidden="true">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <nav class="social" aria-label="Social links">
    <a href="https://www.instagram.com/kro_pk1" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="https://www.tiktok.com/@kro_pk" target="_blank" rel="noopener noreferrer">TikTok</a>
  </nav>

  <script>
    const PASS = 'KROPK2026';
    const STORAGE_KEY = 'kro_pk_site_unlocked';
    const COOKIE_MAX_AGE = 60 * 60 * 24 * 30;
    const images = ['campaign-3.jpg', 'slideshow-1.jpg', 'slideshow-2.jpg'];

    function unlockSite() {
      document.cookie = `${STORAGE_KEY}=1; Max-Age=${COOKIE_MAX_AGE}; Path=/; SameSite=Lax`;
      try {
        localStorage.setItem(STORAGE_KEY, '1');
      } catch {
        // The cookie is the server-side unlock source of truth.
      }
    }

    function hasStoredUnlock() {
      const hasCookie = document.cookie
        .split(';')
        .some(cookie => cookie.trim() === `${STORAGE_KEY}=1`);
      if (hasCookie) return true;
      try {
        return localStorage.getItem(STORAGE_KEY) === '1';
      } catch {
        return false;
      }
    }

    if (hasStoredUnlock()) {
      unlockSite();
      window.location.replace('/shop1.html');
    }

    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    let current = 0;

    slides.forEach((slide, i) => {
      slide.style.backgroundImage = `url('${images[i]}')`;
    });

    function goToSlide(index) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = index;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    setInterval(() => {
      goToSlide((current + 1) % images.length);
    }, 1800);

    const passwordToggle = document.getElementById('passwordToggle');
    const gateForm = document.getElementById('gateForm');
    const gatePassword = document.getElementById('gatePassword');
    const gateError = document.getElementById('gateError');

    passwordToggle.addEventListener('click', () => {
      gateForm.classList.toggle('open');
      gateError.classList.remove('show');
      if (gateForm.classList.contains('open')) gatePassword.focus();
    });

    gateForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (gatePassword.value.trim() === PASS) {
        unlockSite();
        window.location.replace('/shop1.html');
        return;
      }
      gateError.classList.add('show');
    });

    gatePassword.addEventListener('input', () => {
      gateError.classList.remove('show');
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('signupEmail');
      const status = document.getElementById('signupStatus');
      const submit = e.currentTarget.querySelector('button');
      const email = emailInput.value.trim();
      if (!email) return;

      status.classList.remove('error');
      status.textContent = 'Joining...';
      submit.disabled = true;

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name: '' })
        });
        if (!res.ok) throw new Error('Subscribe failed');
        emailInput.value = '';
        status.textContent = "You're on the early access list.";
      } catch {
        status.classList.add('error');
        status.textContent = 'Could not join right now. Try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
