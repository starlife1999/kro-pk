<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coming Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0f172a;
      --ink: #111827;
      --white: #f8fafc;
      --red: #ef4444;
      --yellow: #fbbf24;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Permanent Marker', cursive;
    }

    .slideshow,
    .slide,
    .overlay {
      position: fixed;
      inset: 0;
    }

    .slideshow {
      z-index: 1;
    }

    .slide {
      opacity: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.68), rgba(15, 23, 42, 0.82)),
        rgba(15, 23, 42, 0.34);
    }

    .login-trigger {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 10;
      border: 0;
      background: transparent;
      color: var(--white);
      cursor: pointer;
      font-family: 'Bangers', cursive;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.82;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .login-trigger:hover,
    .login-trigger:focus-visible {
      color: var(--yellow);
      opacity: 1;
      outline: none;
    }

    .login-prompt {
      position: fixed;
      top: max(3.25rem, calc(2.75rem + env(safe-area-inset-top)));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 10;
      display: none;
      width: min(280px, calc(100vw - 2rem));
    }

    .login-prompt.open {
      display: block;
    }

    .login-form {
      display: grid;
      gap: 0.55rem;
    }

    .login-form input {
      min-height: 42px;
      border: 2px solid var(--white);
      background: rgba(15, 23, 42, 0.88);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      padding: 0.7rem 0.75rem;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
    }

    .login-form input::placeholder {
      color: #94a3b8;
    }

    .login-form input:focus {
      border-color: var(--yellow);
      outline: none;
    }

    .login-submit {
      min-height: 42px;
      border: 2px solid var(--white);
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .login-submit:hover,
    .login-submit:focus-visible {
      background: var(--yellow);
      color: var(--ink);
      outline: none;
    }

    .login-submit:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .login-status {
      min-height: 1rem;
      color: #fecaca;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      text-align: right;
    }

    .main-stage {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: max(3.75rem, env(safe-area-inset-top)) 1.25rem max(4.75rem, env(safe-area-inset-bottom));
    }

    .signup-panel {
      width: min(520px, 100%);
    }

    .signup-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      width: 100%;
    }

    .signup-form input {
      min-height: 56px;
      border: 3px solid var(--white);
      background: rgba(15, 23, 42, 0.84);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      padding: 0.95rem 1rem;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.45);
    }

    .signup-form input::placeholder {
      color: #94a3b8;
    }

    .signup-form input:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .signup-submit {
      min-height: 56px;
      border: 3px solid var(--white);
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      font-family: 'Bangers', cursive;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      letter-spacing: 0.06em;
      padding: 0.8rem 1rem;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.45);
      transition: all 0.2s ease;
    }

    .signup-submit:hover,
    .signup-submit:focus-visible {
      transform: translateY(-2px);
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 7px 7px 0 var(--red);
      outline: none;
    }

    .signup-submit:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .signup-status {
      min-height: 1.25rem;
      margin-top: 1rem;
      color: var(--yellow);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      text-align: center;
    }

    .signup-status.error {
      color: #fecaca;
    }

    .social {
      position: fixed;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 50%;
      z-index: 10;
      display: flex;
      gap: 1rem;
      transform: translateX(-50%);
    }

    .social a {
      color: var(--white);
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .social a:hover {
      color: var(--yellow);
    }

    @media (max-width: 640px) {
      body {
        overflow-y: auto;
      }

      .signup-panel {
        width: min(360px, 100%);
      }

      .signup-form {
        grid-template-columns: 1fr;
      }

      .signup-submit {
        width: 100%;
      }

      .social {
        bottom: max(1rem, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="slideshow" aria-hidden="true">
    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <div class="overlay" aria-hidden="true"></div>

  <button class="login-trigger" id="loginTrigger" type="button" aria-expanded="false" aria-controls="loginPrompt">LOG IN</button>

  <div class="login-prompt" id="loginPrompt">
    <form class="login-form" id="loginForm">
      <input type="password" id="accessPassword" placeholder="Password" autocomplete="current-password" required>
      <button class="login-submit" type="submit">ENTER</button>
      <p class="login-status" id="loginStatus" aria-live="polite"></p>
    </form>
  </div>

  <main class="main-stage">
    <section class="signup-panel" aria-label="Email signup">
      <form class="signup-form" id="signupForm">
        <input type="email" id="signupEmail" placeholder="your@email.com" autocomplete="email" required>
        <button class="signup-submit" type="submit">GET EARLY ACCESS</button>
      </form>
      <p class="signup-status" id="signupStatus" aria-live="polite"></p>
    </section>
  </main>

  <nav class="social" aria-label="Social links">
    <a href="https://www.instagram.com/kro_pk1" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a href="https://www.tiktok.com/@kro_pk" target="_blank" rel="noopener noreferrer">TikTok</a>
  </nav>

  <script>
    const images = ['campaign-3.jpg', 'campaign-4.JPG', 'campaign-5.JPG'];

    const slides = document.querySelectorAll('.slide');
    let current = 0;

    slides.forEach((slide, i) => {
      slide.style.backgroundImage = `url('${images[i]}')`;
    });

    function goToSlide(index) {
      slides[current].classList.remove('active');
      current = index;
      slides[current].classList.add('active');
    }

    setInterval(() => {
      goToSlide((current + 1) % images.length);
    }, 1400);

    // Generate or retrieve visitor ID
    const getVisitorId = () => {
      let id = localStorage.getItem('comingSoonVisitorId');
      if (!id) {
        id = `visitor-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        localStorage.setItem('comingSoonVisitorId', id);
      }
      return id;
    };

    const visitorId = getVisitorId();

    // Log coming soon visit
    const logComingSoonVisit = async (emailSubmitted = false, passwordUnlocked = false, email = '') => {
      try {
        await fetch('/api/coming-soon/visits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            visitorId,
            userAgent: navigator.userAgent,
            emailSubmitted,
            passwordUnlocked,
            email
          })
        }).catch(() => {});
      } catch {}
    };

    // Log page load
    window.addEventListener('DOMContentLoaded', () => {
      logComingSoonVisit(false, false, '');
    });

    const loginTrigger = document.getElementById('loginTrigger');
    const loginPrompt = document.getElementById('loginPrompt');
    const loginForm = document.getElementById('loginForm');
    const accessPassword = document.getElementById('accessPassword');
    const loginStatus = document.getElementById('loginStatus');

    loginTrigger.addEventListener('click', () => {
      const isOpen = loginPrompt.classList.contains('open');
      if (!isOpen) {
        loginPrompt.classList.add('open');
        loginTrigger.setAttribute('aria-expanded', 'true');
        accessPassword.focus();
        return;
      }
      loginPrompt.classList.remove('open');
      loginTrigger.setAttribute('aria-expanded', 'false');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submit = e.currentTarget.querySelector('button');
      const password = accessPassword.value;
      if (!password) return;

      loginStatus.textContent = '';
      submit.disabled = true;

      try {
        const res = await fetch('/api/coming-soon/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Login failed');
        await logComingSoonVisit(false, true, '');
        window.location.assign(data.redirectTo || '/shop');
      } catch (err) {
        loginStatus.textContent = err.message || 'Login failed';
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('signupEmail');
      const status = document.getElementById('signupStatus');
      const submit = e.currentTarget.querySelector('button');
      const email = emailInput.value.trim();
      if (!email) return;

      status.classList.remove('error');
      status.textContent = 'Joining...';
      submit.disabled = true;

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name: '' })
        });
        if (!res.ok) throw new Error('Subscribe failed');
        await logComingSoonVisit(true, false, email);
        emailInput.value = '';
        status.textContent = "You're on the early access list.";
      } catch {
        status.classList.add('error');
        status.textContent = 'Could not join right now. Try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>

  <script src="analytics.js"></script>
</body>
</html>
